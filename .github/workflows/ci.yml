# Intégration continue de Vigie (QUA-01) : à chaque push et pull request.
# - verification : types, lint, tests (PGlite en mémoire puis PostgreSQL), migrations, construction, cloisonnement
#   du rôle Salarié sur le serveur construit, parcours de bout en bout dans Chromium (Playwright, QUA-08) ;
# - image : construction de l'image Docker et sonde de santé du conteneur.
# Version de Node : .nvmrc (champ « engines » de package.json).

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  verification:
    name: Types, lint, tests, migrations, construction
    # Version fixée : Playwright (package-lock.json) ne prend pas en charge ubuntu-latest passé en 26.04 (30/10/2026), et le
    # client PostgreSQL du système suit la version d'Ubuntu ; à faire évoluer avec la version de @playwright/test.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      # Même version majeure que docker-compose.yml : tests d'intégration en mode PostgreSQL (test/setup-postgres.ts).
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vigie
          POSTGRES_PASSWORD: vigie
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vigie"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Dépendances
        run: npm ci --no-audit --no-fund

      - name: Types (next typegen + tsc)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Code mort (QUA-24) : fichiers, exports et dépendances inutilisés (knip.json), quelques secondes.
      - name: Code mort (knip)
        run: npm run knip

      - name: Tests (PGlite en mémoire)
        run: npm test

      - name: Tests d'intégration (PostgreSQL)
        run: npx vitest run test/integration
        env:
          # Base d'administration : chaque fichier de test crée puis supprime sa propre base.
          TEST_DATABASE_URL: postgres://vigie:vigie@localhost:5432/postgres

      - name: Migrations (db:check)
        run: npm run db:check

      - name: Construction (démonstration)
        run: npm run build
        env:
          VIGIE_DEMO: '1'

      # Chromium de Playwright (QUA-08), version fixée par @playwright/test (package-lock.json).
      - name: Navigateur des parcours (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Cloisonnement Salarié (serveur construit)
        env:
          VIGIE_TODAY: '2026-10-09'
          VIGIE_DATA_DIR: ${{ runner.temp }}/vigie-demo
          VIGIE_UPLOAD_DIR: ${{ runner.temp }}/vigie-uploads
          VIGIE_SCHEDULER: '0'
        run: |
          # Serveur laissé en marche pour les étapes suivantes (arrêté avec la tâche).
          npm run start:demo > "$RUNNER_TEMP/vigie-server.log" 2>&1 &
          for i in $(seq 1 60); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3200/api/sante)" = 200 ] && break
            sleep 2
          done
          # Charge des pages du Salarié d'abord, sur le jeu intact ; les parcours Playwright écrivent ensuite dans la base.
          VIGIE_E2E_URL=http://localhost:3200 npx vitest run test/e2e

      # Recette visuelle (QUA-16) : captures comparées à celles du dépôt, sur le jeu encore intact. Non bloquante : le rendu
      # des polices dépend de la machine ; un écart se relit dans le rapport (captures « actual » et « diff »).
      - name: Recette visuelle (non bloquante)
        continue-on-error: true
        env:
          VIGIE_E2E_URL: http://localhost:3200
        run: npm run test:visual

      - name: Parcours dans le navigateur (serveur construit)
        env:
          VIGIE_E2E_URL: http://localhost:3200
        run: npm run test:pw

      - name: Rapport des parcours
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Journal du serveur
        if: failure()
        run: cat "$RUNNER_TEMP/vigie-server.log" || true

  image:
    name: Image Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Construction de l'image
        run: docker build --pull -t vigie:ci .

      - name: Démarrage du conteneur (démonstration) et route de santé
        run: |
          docker run -d --name vigie -p 3000:3000 -e VIGIE_DEMO=1 vigie:ci
          for i in $(seq 1 60); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/sante)" = 200 ] && exit 0
            sleep 2
          done
          docker logs vigie
          exit 1
